<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>接続を確認してください | ミセチョク</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f2fb; color: #241f33; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
        main { max-width: 32rem; padding: 2rem; line-height: 1.8; }
        h1 { font-size: 1.4rem; }
        button { min-height: 48px; padding: .75rem 1.25rem; border: 0; border-radius: .75rem; background: #7c3aed; color: #fff; font: inherit; cursor: pointer; }
        button:focus-visible { outline: 3px solid #241f33; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <p>ミセチョク</p>
        <h1>インターネットに接続できません</h1>
        <p>接続を確認して、もう一度お試しください。送信や保存の途中だった場合は、接続後に結果をご確認ください。</p>
        <button type="button" onclick="location.reload()">元のページを再読み込み</button>
    </main>
</body>
</html>
